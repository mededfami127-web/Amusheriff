name: build

# Manual dispatch (choose a flavor) or a version tag.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Build flavor"
        type: choice
        options: [dev, staging, prod]
        default: prod
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve flavor
        id: flavor
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.flavor }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (riverpod / freezed / json)
        run: dart run build_runner build --delete-conflicting-outputs

      # Values live in repository secrets; nothing secret is committed. Only the
      # public anon key ships to clients — never the service-role key.
      - name: Write flavor config
        env:
          FLAVOR: ${{ steps.flavor.outputs.name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          mkdir -p config
          cat > "config/${FLAVOR}.json" <<JSON
          {
            "FLAVOR": "${FLAVOR}",
            "SUPABASE_URL": "${SUPABASE_URL}",
            "SUPABASE_ANON_KEY": "${SUPABASE_ANON_KEY}",
            "SENTRY_DSN": "${SENTRY_DSN}"
          }
          JSON

      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define-from-file=config/${{ steps.flavor.outputs.name }}.json

      - name: Build App Bundle
        run: >
          flutter build appbundle --release
          --dart-define-from-file=config/${{ steps.flavor.outputs.name }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: asm-${{ steps.flavor.outputs.name }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
