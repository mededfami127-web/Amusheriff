name: flutter ci

# One button, both artifacts.
#
#   Actions → flutter ci → Run workflow → flavor
#
# always produces a debug APK for device testing, plus an AAB for the store.
# When the upload keystore secrets are configured the AAB is release-signed and
# Play-ready; without them the workflow still delivers a debug-signed AAB for
# internal testing and says so in the summary, instead of failing the run.
#
# Also runs on a version tag (`v1.2.3`), where the flavor is always `prod`.

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Build flavor"
        type: choice
        options: [dev, staging, prod]
        default: prod
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Flutter app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test

  android:
    name: Android debug APK + AAB
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: actions/setup-android@v4
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;26.3.11579264
            platform-tools

      - name: Pin NDK path
        run: |
          ndk_dir="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          if [ ! -d "$ndk_dir" ]; then
            echo "::error::Expected NDK 26.3.11579264 was not installed."
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve flavor
        id: flavor
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.flavor }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (riverpod / freezed / json)
        run: dart run build_runner build

      # Values live in repository secrets; nothing secret is committed. Only the
      # public anon key ships to clients — never the service-role key.
      #
      # `CONFIG_BASE64` wins when set: it is the base64 of the whole flavor JSON,
      # which is useful when the values are easier to keep as one secret.
      - name: Write flavor config
        env:
          FLAVOR: ${{ steps.flavor.outputs.name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CONFIG_BASE64: ${{ secrets.CONFIG_BASE64 }}
        run: |
          mkdir -p config
          if [ -n "$CONFIG_BASE64" ]; then
            printf '%s' "$CONFIG_BASE64" | base64 --decode > "config/${FLAVOR}.json"
            echo "Wrote config/${FLAVOR}.json from the CONFIG_BASE64 secret."
          else
            jq -n \
              --arg FLAVOR "$FLAVOR" \
              --arg SUPABASE_URL "$SUPABASE_URL" \
              --arg SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY" \
              --arg SENTRY_DSN "$SENTRY_DSN" \
              '{FLAVOR: $FLAVOR, SUPABASE_URL: $SUPABASE_URL, SUPABASE_ANON_KEY: $SUPABASE_ANON_KEY, SENTRY_DSN: $SENTRY_DSN}' \
              > "config/${FLAVOR}.json"
          fi

          jq -e --arg flavor "$FLAVOR" '
            type == "object"
            and .FLAVOR == $flavor
            and (.SUPABASE_URL | type == "string" and test("^https://[^[:space:]]+$") and (contains("your-") | not))
            and (.SUPABASE_ANON_KEY | type == "string" and (test("^eyJ") or test("^sb_publishable_")) and (contains("paste-your") | not))
          ' "config/${FLAVOR}.json" > /dev/null || {
            echo "::error::Flavor config is invalid or still contains example values. Set the repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions) — or CONFIG_BASE64 with a base64-encoded config/${FLAVOR}.json. See README → First debug run."
            exit 1
          }

      # `ANDROID_KEYSTORE_BASE64` is the base64 of the upload keystore (.jks).
      # Decoding it here is what lets the release AAB be signed without ever
      # committing the keystore; `android/key.properties` is gitignored too.
      #
      # The keystore is optional for this workflow: with it the AAB is Play-ready
      # and signed with the upload key, without it the run still delivers a
      # debug-signed AAB plus the debug APK, so the artifacts are always usable.
      - name: Check release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          if [ -z "$KEYSTORE_BASE64" ]; then missing="$missing ANDROID_KEYSTORE_BASE64"; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then missing="$missing KEYSTORE_PASSWORD"; fi
          if [ -z "$KEY_ALIAS" ]; then missing="$missing KEY_ALIAS"; fi
          if [ -z "$KEY_PASSWORD" ]; then missing="$missing KEY_PASSWORD"; fi

          if [ -n "$missing" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing is not configured (missing:$missing). The AAB in this run will be debug-signed for internal testing, and no Play upload will be possible. See README → Release signing."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode the upload keystore
        if: steps.signing.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          # A truncated or mistyped secret decodes to a file that is not a
          # keystore; fail here rather than inside a Gradle task.
          if ! keytool -list -keystore android/app/upload-keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::android/app/upload-keystore.jks is not a valid keystore — re-check ANDROID_KEYSTORE_BASE64 and KEYSTORE_PASSWORD."
            exit 1
          fi

          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/android/app/upload-keystore.jks
          PROPS

          echo "Upload keystore decoded — the AAB will be signed with alias '$KEY_ALIAS'."

      - name: Build debug APK
        run: >
          flutter build apk --debug
          --dart-define-from-file=config/${{ steps.flavor.outputs.name }}.json

      - name: Build release App Bundle (signed)
        if: steps.signing.outputs.release == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: >
          flutter build appbundle --release --flavor prod
          --dart-define-from-file=config/prod.json
          --obfuscate --split-debug-info=build/symbols

      - name: Build debug-signed App Bundle
        if: steps.signing.outputs.release != 'true' || (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v'))
        run: >
          flutter build appbundle --debug
          --dart-define-from-file=config/${{ steps.flavor.outputs.name }}.json

      - name: Show what was built
        shell: bash
        run: |
          set -euo pipefail
          echo "=== build outputs ==="
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
          if [ "${{ steps.signing.outputs.release }}" = "true" ] && [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "=== release AAB (signed) ==="
            ls -lh build/app/outputs/bundle/release/app-release.aab
          elif [ "${{ steps.signing.outputs.release }}" = "true" ]; then
            ls -lh build/app/outputs/flutter-apk/app-release.apk \
                  build/app/outputs/bundle/release/app-release.aab
          else
            ls -lh build/app/outputs/bundle/debug/app-debug.aab
          fi

      # Three separate artifacts so a device build and a store build never have
      # to be downloaded together.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: asm-${{ steps.flavor.outputs.name }}-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release AAB only
        if: steps.signing.outputs.release == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: asm-prod-release
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload release APK + AAB
        if: steps.signing.outputs.release == 'true' && (github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: asm-${{ steps.flavor.outputs.name }}-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload debug-signed AAB
        if: steps.signing.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: asm-${{ steps.flavor.outputs.name }}-debug-aab
          path: build/app/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

      - name: Summarise the run
        if: always()
        run: |
          {
            echo "## flutter ci — ${FLAVOR}"
            echo ""
            echo "| Artifact | Ready to use |"
            echo "| --- | --- |"
            echo "| Debug APK | yes — install on a device |"
            if [ "${{ steps.signing.outputs.release }}" = "true" ]; then
              echo "| Release AAB | yes — signed with the upload key, upload to Play |"
            else
              echo "| Debug AAB | internal testing only — configure the keystore secrets for a Play-ready bundle |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          FLAVOR: ${{ steps.flavor.outputs.name }}
