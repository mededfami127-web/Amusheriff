name: build

# Manual dispatch (choose a flavor) or a version tag.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Build flavor"
        type: choice
        options: [dev, staging, prod]
        default: prod
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve flavor
        id: flavor
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.flavor }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=prod" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (riverpod / freezed / json)
        run: dart run build_runner build --delete-conflicting-outputs

      # Values live in repository secrets; nothing secret is committed. Only the
      # public anon key ships to clients — never the service-role key.
      #
      # `CONFIG_BASE64` wins when set: it is the base64 of the whole flavor JSON,
      # which is useful when the values are easier to keep as one secret.
      - name: Write flavor config
        env:
          FLAVOR: ${{ steps.flavor.outputs.name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CONFIG_BASE64: ${{ secrets.CONFIG_BASE64 }}
        run: |
          mkdir -p config
          if [ -n "$CONFIG_BASE64" ]; then
            printf '%s' "$CONFIG_BASE64" | base64 --decode > "config/${FLAVOR}.json"
            echo "Wrote config/${FLAVOR}.json from the CONFIG_BASE64 secret."
            exit 0
          fi
          cat > "config/${FLAVOR}.json" <<JSON
          {
            "FLAVOR": "${FLAVOR}",
            "SUPABASE_URL": "${SUPABASE_URL}",
            "SUPABASE_ANON_KEY": "${SUPABASE_ANON_KEY}",
            "SENTRY_DSN": "${SENTRY_DSN}"
          }
          JSON

      # `ANDROID_KEYSTORE_BASE64` is the base64 of the upload keystore (.jks).
      # Decoding it here is what lets the release AAB be signed without ever
      # committing the keystore; `android/key.properties` is gitignored too.
      # Without the secret the build still runs, but the AAB is debug-signed and
      # Play will reject it — hence the explicit warning.
      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — the release AAB will be signed with the debug keystore and cannot be uploaded to Play. See README → Release signing."
            exit 0
          fi

          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name must be set alongside ANDROID_KEYSTORE_BASE64."
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          # A truncated or mistyped secret decodes to a file that is not a
          # keystore; fail here rather than inside a Gradle task.
          if ! keytool -list -keystore android/app/upload-keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::android/app/upload-keystore.jks is not a valid keystore — re-check ANDROID_KEYSTORE_BASE64 and KEYSTORE_PASSWORD."
            exit 1
          fi

          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/android/app/upload-keystore.jks
          PROPS

          echo "Release keystore decoded — the AAB will be signed with alias '$KEY_ALIAS'."

      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define-from-file=config/${{ steps.flavor.outputs.name }}.json

      - name: Build App Bundle
        run: >
          flutter build appbundle --release
          --dart-define-from-file=config/${{ steps.flavor.outputs.name }}.json

      - name: Record which key signed the bundle
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: asm-${{ steps.flavor.outputs.name }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
