name: debug apk

# A debug APK for quick device testing: no keystore, no Play signing, dev flavor.
# Runs on every push to main, so the newest build is always one download away
# (repo → Actions → this run → Artifacts → asm-dev-debug-apk), and on demand from
# the Actions UI. Release APK/AAB signing stays in build.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  debug-apk:
    name: Android debug APK (dev flavor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (riverpod / freezed / json)
        run: dart run build_runner build --delete-conflicting-outputs

      # `bootstrap()` calls Env.assertConfigured() *before* the first frame, so an
      # APK built without these values cannot start — it dies on a red screen with
      # a "Missing compile-time configuration" error. Fail the job with the fix
      # instead of uploading an artifact that is guaranteed not to open.
      - name: Write dev flavor config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CONFIG_BASE64: ${{ secrets.CONFIG_BASE64 }}
        run: |
          mkdir -p config
          if [ -n "$CONFIG_BASE64" ]; then
            printf '%s' "$CONFIG_BASE64" | base64 --decode > config/dev.json
            echo "Wrote config/dev.json from the CONFIG_BASE64 secret."
            exit 0
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::This APK cannot start without a Supabase project. Add the repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions), or set CONFIG_BASE64 to a base64-encoded config/dev.json. See README → First debug run."
            exit 1
          fi
          cat > config/dev.json <<JSON
          {
            "FLAVOR": "dev",
            "SUPABASE_URL": "${SUPABASE_URL}",
            "SUPABASE_ANON_KEY": "${SUPABASE_ANON_KEY}",
            "SENTRY_DSN": "${SENTRY_DSN}",
            "LOG_LEVEL": "debug"
          }
          JSON

      # The first run on a fresh runner also downloads the NDK that
      # `ndkVersion = flutter.ndkVersion` pins, so allow a generous timeout.
      - name: Build debug APK
        timeout-minutes: 30
        run: >
          flutter build apk --debug
          --dart-define-from-file=config/dev.json

      - name: Show what was built
        run: ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: asm-dev-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
