name: debug apk

# A debug APK for quick device testing: no keystore, no Play signing, dev flavor.
# Runs on every push to main, so the newest build is always one download away
# (repo → Actions → this run → Artifacts → asm-dev-debug-apk), and on demand from
# the Actions UI. Release APK/AAB signing stays in build.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Two quick pushes to main should leave one APK build standing, not a queue.
concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Android debug APK (dev flavor)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (riverpod / freezed / json)
        run: dart run build_runner build

      # Same shape and the same validation the release workflow applies, with an
      # error that names the fix for a first-time setup: `bootstrap()` calls
      # Env.assertConfigured() *before* the first frame, so an APK built without
      # a real backend dies on a red screen and is worth nothing to download.
      - name: Write dev flavor config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CONFIG_BASE64: ${{ secrets.CONFIG_BASE64 }}
        run: |
          mkdir -p config
          if [ -n "$CONFIG_BASE64" ]; then
            printf '%s' "$CONFIG_BASE64" | base64 --decode > config/dev.json
            echo "Wrote config/dev.json from the CONFIG_BASE64 secret."
          else
            jq -n \
              --arg FLAVOR "dev" \
              --arg SUPABASE_URL "$SUPABASE_URL" \
              --arg SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY" \
              --arg SENTRY_DSN "$SENTRY_DSN" \
              --arg LOG_LEVEL "debug" \
              '{FLAVOR: $FLAVOR, SUPABASE_URL: $SUPABASE_URL, SUPABASE_ANON_KEY: $SUPABASE_ANON_KEY, SENTRY_DSN: $SENTRY_DSN, LOG_LEVEL: $LOG_LEVEL}' \
              > config/dev.json
          fi

          jq -e --arg flavor "dev" '
            type == "object"
            and .FLAVOR == $flavor
            and (.SUPABASE_URL | type == "string" and test("^https://[^[:space:]]+$") and (contains("your-") | not))
            and (.SUPABASE_ANON_KEY | type == "string" and (test("^eyJ") or test("^sb_publishable_")) and (contains("paste-your-") | not))
          ' config/dev.json > /dev/null || {
            echo "::error::config/dev.json is missing, empty or still holds example values. Add the repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions) — or CONFIG_BASE64 with a base64-encoded config/dev.json. See README → First debug run."
            exit 1
          }

      # The first run on a fresh runner also downloads the NDK that
      # `ndkVersion = flutter.ndkVersion` pins, so allow a generous timeout.
      - name: Build debug APK
        timeout-minutes: 30
        run: >
          flutter build apk --debug
          --dart-define-from-file=config/dev.json

      - name: Show what was built
        run: ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: asm-dev-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
