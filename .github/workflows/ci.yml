name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-run the whole gate on demand, without pushing an empty commit.
  workflow_dispatch:

# `contents: read` only: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  # ── Dart / Flutter ────────────────────────────────────────────────────────
  flutter:
    name: analyze & test
    runs-on: ubuntu-latest
    # A hung `pub get` or generator must not hold a runner for six hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Two generators produce committed artifacts, and both are checked here.
      #
      # `flutter gen-l10n` writes lib/core/l10n/generated from lib/l10n/app_*.arb,
      # and `tool/gen_text_overlay.dart` restates those ARBs as
      # lib/core/l10n/text_catalog.dart + lib/core/l10n/overridable_localizations.dart,
      # which is what the owner-facing wording editor reads. Committing the output
      # keeps a fresh checkout building without either generator, and this step is
      # what keeps that snapshot honest: adding an ARB key and forgetting the
      # overlay generator would otherwise leave the new string invisible to the
      # owner while CI stayed green.
      #
      # `git status` rather than `git diff` so a newly generated file counts as
      # drift too, not only a modified one.
      - name: Verify generated sources are up to date
        # Bash explicitly: the path list below is an array.
        shell: bash
        run: |
          flutter gen-l10n
          # No `--delete-conflicting-outputs`: build_runner 2.16 removed the
          # option (it deletes conflicting output by default now) and prints a
          # "removed and were ignored" warning for it.
          dart run build_runner build
          dart run tool/gen_text_overlay.dart

          paths=(
            '*.g.dart'
            '*.freezed.dart'
            'lib/core/l10n/generated'
            'lib/core/l10n/text_catalog.dart'
            'lib/core/l10n/overridable_localizations.dart'
          )

          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "::error::Generated sources are stale. Run 'flutter gen-l10n', 'dart run build_runner build' and 'dart run tool/gen_text_overlay.dart', then commit the output."
            git status --short -- "${paths[@]}"
            git --no-pager diff --stat -- "${paths[@]}"
            # The full diff, so the regenerated output can be committed without
            # running the generators on a developer machine.
            git --no-pager diff -- "${paths[@]}"
            exit 1
          fi

          echo "Generated sources are in sync with lib/l10n/app_*.arb."

      # The drift check above compares the generated output to the ARBs, so it
      # cannot see a key that is in the template but in none of the
      # translations: `flutter gen-l10n` answers that case with the English
      # wording and says nothing. This is the gate for it.
      - name: Check localization key parity
        run: dart run tool/check_l10n_parity.dart

      # The generator above is made to format its own output, so this gate and
      # that one agree by construction. Kept as its own step because the failure
      # is a style one with a one-line fix, and because a reformat is a diff the
      # author should see before merging, not something CI silently applies.
      - name: Check formatting
        run: |
          if ! dart format --output=none --set-exit-if-changed . ; then
            echo "::error::Dart files are not formatted. Run 'dart format .' and commit the result."
            # The diff, so the formatted result can be committed verbatim.
            dart format . >/dev/null
            git --no-pager diff
            exit 1
          fi

      - name: Analyze (fatal on infos)
        run: flutter analyze --fatal-infos

      - name: Unit tests
        run: flutter test --coverage

      # Analyze and the unit tests never compile the app for release, so a
      # pubspec asset or font that no longer exists, or code only a release
      # compile rejects, would reach main unnoticed. This is the cheap compile
      # gate: no Android SDK, no signing, and the same asset bundling a device
      # build performs.
      - name: Compile a release bundle
        run: flutter build bundle --release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # ── Edge Function: the repo's only server-side code ───────────────────────
  # The SQL suite below covers the database, and the Flutter jobs above cover
  # the app, but nothing compiled `supabase/functions/inquiry` — which runs on
  # Supabase's servers with the service-role key and is the one file where a
  # type error reaches production without a client noticing. Deno is the Edge
  # Runtime's own runtime, pinned so the lint and format rules cannot drift out
  # from under the tree.
  edge-function:
    name: edge function check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7

      # `deno check` resolves the esm.sh type definitions the function imports,
      # so this also proves the dependency version pinned in the import still
      # exists and still type-checks.
      - name: Type-check, lint and format-check
        run: |
          deno check supabase/functions/inquiry/index.ts
          deno lint supabase/functions/inquiry/index.ts
          deno fmt --check supabase/functions/inquiry/index.ts

  # ── iOS: release compile, unsigned ────────────────────────────────────────
  # Half of the shipped app is iOS, and until this job existed nothing compiled
  # it: `flutter analyze` reads Dart, not an Xcode project, so a plugin raising
  # the iOS deployment target, a stale Podfile or a broken Info.plist would only
  # surface on a Mac. `--no-codesign` keeps the job secret-free — unsigned, no
  # Apple certificate and no provisioning profile — while a real Xcode release
  # build of the same sources runs on a macOS simulator-free device target.
  ios:
    name: iOS release compile
    # Not on every push. On this repository GitHub has repeatedly failed to
    # acquire a hosted macOS runner ("The job was not acquired by Runner of type
    # hosted even after multiple attempts"), which turned the whole run red after
    # 15 minutes without compiling a single line — no iOS signal, just a red gate
    # that trains people to ignore CI. The compile is still here, and still the
    # only thing that proves the Xcode project builds, but it runs when someone
    # asks for it (dispatch) or when a release tag is about to ship, not on every
    # commit to main.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      # The committed example config stands in for the secrets: the build only
      # needs the define to resolve at compile time, and a red screen at
      # runtime is not what this job is checking.
      - name: Build iOS (no codesign)
        run: >
          flutter build ios --release --no-codesign
          --dart-define-from-file=config/prod.json.example

      - name: Show what was built
        run: ls -ld build/ios/iphoneos/Runner.app

  # ── Database: RLS acceptance suite ────────────────────────────────────────
  rls:
    name: RLS acceptance suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Apply shim, migrations, seed and run the RLS suite
        run: bash scripts/run_rls_tests.sh
