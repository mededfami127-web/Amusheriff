name: Build APK and AAB<br/>on:<br/>  push:<br/>    branches: [ main ]<br/>jobs:<br/>  build:<br/>    runs-on: ubuntu-latest<br/>    steps:<br/>      - uses: actions/checkout@v4<br/>      - uses: actions/setup-java@v4<br/>        with:<br/>          distribution: \&#39;zulu\&#39;<br/>          java-version: \&#39;17\&#39;<br/>      - uses: subosito/flutter-action@v2<br/>        with:<br/>          channel: \&#39;stable\&#39;<br/>      - run: |<br/>          if [ ! -d &quot;android&quot; ]; then<br/>            flutter create --org com.amusheriff --project-name amu_sharif_arabiyan_majlis . --no-overwrite<br/>          fi<br/>      - run: flutter pub get<br/>      - run: dart run build_runner build --delete-conflicting-outputs || true<br/>      - run: flutter analyze --fatal-infos || true<br/>      - run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}<br/>      - run: flutter build appbundle --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}<br/>      - uses: actions/upload-artifact@v4<br/>        with:<br/>          name: apk-aab<br/>          path: |<br/>            build/app/outputs/flutter-apk/app-release.apk<br/>            build/app/outputs/bundle/release/app-release.aab