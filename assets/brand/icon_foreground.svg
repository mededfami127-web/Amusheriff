<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="ASM adaptive foreground">
  <defs>
    <linearGradient id="goldGradientFG" gradientUnits="userSpaceOnUse"
                    x1="512" y1="424" x2="512" y2="602">
      <stop offset="0" stop-color="#786A08"/>
      <stop offset="0.38" stop-color="#BE8C0E"/>
      <stop offset="0.62" stop-color="#FAD660"/>
      <stop offset="1" stop-color="#B0800C"/>
