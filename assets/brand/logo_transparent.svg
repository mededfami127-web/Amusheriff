<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="ASM mark">
  <defs>
    <linearGradient id="brandGradientT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6A11CB"/>
      <stop offset="1" stop-color="#D41F8F"/>
    </linearGradient>
    <linearGradient id="goldGradientT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6C97A"/>
      <stop offset="1" stop-color="#B8893A"/>
    </linearGradient>
  </defs>

  <!-- Sofa glyph in brand gradient -->
  <g fill="url(#brandGradientT)">
    <rect x="252" y="288" width="520" height="182" rx="60" ry="60"/>
    <rect x="176" y="380" width="128" height="226" rx="60" ry="60"/>
    <rect x="720" y="380" width="128" height="226" rx="60" ry="60"/>
    <rect x="228" y="456" width="568" height="150" rx="50" ry="50"/>
    <rect x="262" y="600" width="36" height="54" rx="17" ry="17"/>
    <rect x="726" y="600" width="36" height="54" rx="17" ry="17"/>
  </g>

  <g stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" opacity="0.55">
    <line x1="428" y1="474" x2="428" y2="586"/>
    <line x1="596" y1="474" x2="596" y2="586"/>
  </g>

  <text x="512" y="830" text-anchor="middle"
        font-family="DejaVu Serif, Georgia, 'Times New Roman', serif"
        font-size="176" font-weight="700" letter-spacing="26"
        fill="#C9A24D">ASM</text>

  <rect x="360" y="880" width="304" height="7" rx="3.5" fill="url(#goldGradientT)"/>
</svg>
